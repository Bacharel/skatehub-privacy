<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmado — SkateHub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1a1a;
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1px solid #2a2a2a;
    }
    .logo { font-size: 48px; margin-bottom: 8px; }
    .brand {
      font-size: 22px;
      font-weight: 700;
      color: #F5C518;
      letter-spacing: 4px;
      margin-bottom: 32px;
    }
    .check {
      width: 72px;
      height: 72px;
      background: #5DCAA520;
      border-radius: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      border: 1px solid #5DCAA540;
    }
    .check svg { width: 36px; height: 36px; }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }
    p {
      font-size: 15px;
      color: #888;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: #F5C518;
      color: #000;
      font-weight: 700;
      font-size: 16px;
      padding: 16px 32px;
      border-radius: 12px;
      text-decoration: none;
      width: 100%;
    }
    .footer {
      margin-top: 24px;
      font-size: 13px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⬡</div>
    <div class="brand">SKATEHUB</div>
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5DCAA5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>Email confirmado!</h1>
    <p>Sua conta foi verificada com sucesso. Agora você pode fazer login no SkateHub e descobrir os melhores spots da sua cidade.</p>
    <a href="skatehub://login" class="btn">Abrir SkateHub</a>
    <div class="footer">Se o app não abrir, abra manualmente e faça login.</div>
  </div>
</body>
</html>
